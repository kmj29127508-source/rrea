<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직접 계산 — 그리디 / 그리디+유전</title>
<link rel="stylesheet" href="style.css">
<style>
  .step { border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .step h3 { margin: 0 0 10px; font-size: 14px; color: var(--ink); }
  .step.disabled { opacity: .45; pointer-events: none; }
  .file-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .file-row .name { width: 170px; color: var(--muted); flex: none; }
  .file-row .state { font-size: 12px; color: var(--muted); }
  .file-row .state.ok { color: var(--good, #1a7f4b); }
  .field-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .field-row label { font-size: 13px; color: var(--muted); display: block; }
  .field-row select, .field-row input[type=number] { display: block; margin-top: 3px; min-width: 200px; }
  #pyStatus { font-size: 13px; color: var(--muted); white-space: pre-line; }
  #runBtn { padding: 10px 22px; font-size: 14px; }
  #runBtn:disabled { opacity: .5; cursor: not-allowed; }
  .kpi2 { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin: 14px 0; }
  .kpi2 div { background: var(--soft); border-radius: 8px; padding: 10px 12px; }
  .kpi2 span { display:block; font-size: 11px; color: var(--muted); }
  .kpi2 b { font-size: 18px; }
  #resultArea h4 { font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
  .back { font-size: 13px; }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>직접 계산 — 그리디 / 그리디+유전</h1>
    <p>파일을 올리면 브라우저 안에서 바로 계산해요(서버로 전송 안 됨). <a class="back" href="index.html">← 비교표로 돌아가기</a></p>
  </div>
</header>

<div class="layout" style="grid-template-columns: 1fr;">
<main>

  <section class="step" id="stepPy">
    <h3>1. 계산 엔진 준비</h3>
    <p id="pyStatus">준비 중...</p>
  </section>

  <section class="step disabled" id="stepFiles">
    <h3>2. 주문 데이터 올리기</h3>
    <div class="file-row"><span class="name">simple_data.xlsx (주문)</span><input type="file" id="fSimple" accept=".xlsx"><span class="state" id="fSimpleState"></span></div>
    <div class="file-row"><span class="name">sku_size.xlsx (제품 크기)</span><input type="file" id="fSize" accept=".xlsx"><span class="state" id="fSizeState"></span></div>
    <div class="file-row"><span class="name">sku_production_time.csv</span><input type="file" id="fTime" accept=".csv"><span class="state" id="fTimeState"></span></div>
    <p id="loadStatus" class="load-msg"></p>
  </section>

  <section class="step disabled" id="stepParam">
    <h3>3. 날짜 · 그리디 규칙 선택</h3>
    <div class="field-row">
      <label>날짜 <select id="pDate"></select></label>
      <label>1순위 <select id="pPrimary"></select></label>
      <label>2순위(동점이면) <select id="pTie2"></select></label>
      <label>3순위(그래도 동점이면) <select id="pTie3"></select></label>
    </div>
    <div class="field-row">
      <label><input type="checkbox" id="pGenetic"> 유전 알고리즘으로 추가 개선</label>
      <label id="pBudgetWrap" style="display:none">예산(반복 채점 횟수) <input type="number" id="pBudget" value="150" min="20" max="2000" style="min-width:100px"></label>
    </div>
    <button id="runBtn" disabled>계산하기</button>
    <p id="runStatus" class="load-msg"></p>
  </section>

  <section id="resultArea" hidden>
    <h2 id="resultTitle"></h2>
    <div class="kpi2" id="kpi2"></div>
    <h4>생산 진행에 따른 주문 완료</h4>
    <div id="progressChart" class="chart"></div>
    <h4>시간에 따른 선반 사용량</h4>
    <div id="shelfChart" class="chart"></div>
  </section>

</main>
</div>

<script>
const PY_CORE = "\"\"\"\nproduction_core.py \u2014 production_sim.py\uc758 \"\uacc4\uc0b0 \uc5d4\uc9c4\"\ub9cc \ucd94\ub9b0 \ubc84\uc804 (\uadf8\ub9bc \uadf8\ub9ac\ub294 \ubd80\ubd84 \uc5c6\uc74c)\n\n\ube0c\ub77c\uc6b0\uc800(Pyodide)\uc5d0\uc11c \uadf8\ub300\ub85c \ub3cc\ub9ac\ub824\uace0, matplotlib \uc758\uc874\uc131\uc744 \ube80 \ubc84\uc804\uc785\ub2c8\ub2e4.\nload_data()/simulate_day()\uc758 \uacc4\uc0b0 \ub85c\uc9c1\uc740 production_sim.py\uc640 \uc644\uc804\ud788 \ub3d9\uc77c\ud569\ub2c8\ub2e4\n(\uadf8\ub300\ub85c \ubcf5\uc0ac \u2014 \ub85c\uc9c1\uc744 \ubc14\uafb8\uc9c0 \uc54a\uc558\uc2b5\ub2c8\ub2e4). \uadf8\ub9bc\uc740 \uc6f9\ud398\uc774\uc9c0\uac00 SVG\ub85c \uc9c1\uc811 \uadf8\ub9bd\ub2c8\ub2e4.\n\n\uc0b0\ucd9c\ubb3c \uac80\uc99d: \uc774 \ud30c\uc77c\ub85c \ub098\uc628 \uacb0\uacfc\uac00 production_sim.py\ub85c \ub098\uc628 \uacb0\uacfc\uc640 \uc815\ud655\ud788 \uac19\uc740\uc9c0,\nexport_detail.py\ub85c \ubf51\uc740 \uac12\uacfc \ube44\uad50\ud574\uc11c \ud655\uc778\ud558\uc138\uc694(READ ME \uc548\ub0b4 \ucc38\uace0).\n\"\"\"\nimport heapq\nimport math\n\nimport numpy as np\nimport pandas as pd\n\nORDER_FILE = \"simple_data.xlsx\"\nSIZE_FILE = \"sku_size.xlsx\"\nPROD_TIME_FILE = \"sku_production_time.csv\"\n\nCELL_CAPACITY = 10_000\nPICK_SEC_PER_ITEM = 10\nN_PICKERS = 1\nPICK_RULE = \"strict\"\nTYPE_ORDER = [\"DD\", \"PD\"]\nH = 3600\n\n\ndef load_data(order_file=ORDER_FILE, size_file=SIZE_FILE, prod_time_file=PROD_TIME_FILE):\n    orders = pd.read_excel(order_file)\n    orders[\"ORDER_DATE\"] = pd.to_datetime(orders[\"ORDER_DATE\"]).dt.normalize()\n    lines = (orders.groupby([\"ORDER_DATE\", \"ORDER_NO\", \"DELIVERY_TYPE\", \"SKU_CD\", \"SKU_NM\"])\n                   .size().rename(\"QTY\").reset_index())\n\n    size = pd.read_excel(size_file).iloc[:, :4]\n    size.columns = [\"SKU_NM\", \"LEN\", \"WD\", \"HT\"]\n    size[\"VOLUME\"] = size[\"LEN\"] * size[\"WD\"] * size[\"HT\"]\n    size = size.groupby(\"SKU_NM\", as_index=False)[\"VOLUME\"].max()\n\n    sku = lines[[\"SKU_CD\", \"SKU_NM\"]].drop_duplicates().merge(size, on=\"SKU_NM\", how=\"left\")\n    missing = sku.loc[sku[\"VOLUME\"].isna(), \"SKU_NM\"].tolist()\n    if missing:\n        default_volume = float(size[\"VOLUME\"].median())\n        print(f\"[\uc54c\ub9bc] \ud06c\uae30 \uc815\ubcf4 \uc5c6\ub294 SKU {len(missing)}\uac1c \u2192 \ubd80\ud53c {default_volume:.0f} \uc801\uc6a9: {missing}\")\n        sku[\"VOLUME\"] = sku[\"VOLUME\"].fillna(default_volume)\n    sku[\"PER_CELL\"] = np.floor(CELL_CAPACITY / sku[\"VOLUME\"]).astype(int)\n    sku[\"CELLS_PER_UNIT\"] = np.ceil(sku[\"VOLUME\"] / CELL_CAPACITY).astype(int)\n\n    pt = pd.read_csv(prod_time_file, encoding=\"utf-8-sig\")[[\"SKU_CD\", \"SETUP_SEC\", \"UNIT_SEC\"]]\n    sku = sku.merge(pt, on=\"SKU_CD\", how=\"left\")\n    no_time = sku.loc[sku[\"SETUP_SEC\"].isna() | sku[\"UNIT_SEC\"].isna(), \"SKU_CD\"].tolist()\n    if no_time:\n        raise ValueError(f\"{prod_time_file}\uc5d0 \uc0dd\uc0b0\uc2dc\uac04\uc774 \uc5c6\ub294 SKU\uac00 \uc788\uc2b5\ub2c8\ub2e4: {no_time}\")\n    return sku.set_index(\"SKU_CD\"), lines\n\n\ndef _check(seq, need, where):\n    counts = pd.Series(seq, dtype=object).value_counts()\n    dup = sorted(counts[counts > 1].index)\n    miss = sorted(set(need) - set(seq))\n    extra = sorted(set(seq) - set(need))\n    if dup or miss or extra:\n        msg = [f\"[{where}] \uc0dd\uc0b0\uc21c\uc11c\uc5d0 \ubb38\uc81c\uac00 \uc788\uc2b5\ub2c8\ub2e4.\"]\n        if miss:\n            msg.append(f\"  \ub204\ub77d {len(miss)}\uac1c: {miss[:10]}\")\n        if dup:\n            msg.append(f\"  \uc911\ubcf5 {len(dup)}\uac1c: {dup[:10]}\")\n        if extra:\n            msg.append(f\"  \ud574\ub2f9 \uc8fc\ubb38\uc5d0 \uc5c6\ub294 SKU {len(extra)}\uac1c: {extra[:10]}\")\n        raise ValueError(\"\\n\".join(msg))\n\n\ndef _cells(qty, per_cell, cells_per_unit):\n    if qty <= 0:\n        return 0\n    return math.ceil(qty / per_cell) if per_cell >= 1 else qty * cells_per_unit\n\n\ndef _pick(od):\n    rank = {t: i for i, t in enumerate(TYPE_ORDER)}\n    od = od.assign(RANK=od[\"TYPE\"].map(rank).fillna(len(rank)).astype(int))\n    pickers = [0.0] * N_PICKERS\n    start, done = {}, {}\n\n    if PICK_RULE == \"strict\":\n        q = od.sort_values([\"RANK\", \"READY\", \"ORDER_NO\"], kind=\"stable\")\n        for o, ready, n in zip(q[\"ORDER_NO\"], q[\"READY\"], q[\"N_ITEMS\"]):\n            free = heapq.heappop(pickers)\n            s = max(free, ready)\n            e = s + n * PICK_SEC_PER_ITEM\n            heapq.heappush(pickers, e)\n            start[o], done[o] = s, e\n    elif PICK_RULE == \"priority\":\n        pending = od.sort_values([\"READY\", \"RANK\", \"ORDER_NO\"])[[\"ORDER_NO\", \"READY\", \"RANK\", \"N_ITEMS\"]].to_numpy()\n        i, avail = 0, []\n        while i < len(pending) or avail:\n            t = heapq.heappop(pickers)\n            if not avail and i < len(pending) and pending[i][1] > t:\n                t = pending[i][1]\n            while i < len(pending) and pending[i][1] <= t:\n                o, ready, rk, n = pending[i]\n                heapq.heappush(avail, (rk, ready, o, n))\n                i += 1\n            rk, ready, o, n = heapq.heappop(avail)\n            e = t + n * PICK_SEC_PER_ITEM\n            heapq.heappush(pickers, e)\n            start[o], done[o] = t, e\n    else:\n        raise ValueError(\"PICK_RULE\uc740 'strict' \ub610\ub294 'priority'\")\n\n    od = od.drop(columns=\"RANK\")\n    od[\"PICK_START\"] = od[\"ORDER_NO\"].map(start)\n    od[\"DONE\"] = od[\"ORDER_NO\"].map(done)\n    od[\"WAIT\"] = od[\"PICK_START\"] - od[\"READY\"]\n    return od\n\n\ndef simulate_day(day_lines, seq, sku):\n    qty = day_lines.groupby(\"SKU_CD\")[\"QTY\"].sum()\n    _check(seq, qty.index, \"\uc0dd\uc0b0\uc21c\uc11c\")\n\n    q = qty.loc[seq].to_numpy()\n    dur = sku.loc[seq, \"SETUP_SEC\"].to_numpy(float) + sku.loc[seq, \"UNIT_SEC\"].to_numpy(float) * q\n    end = np.cumsum(dur)\n    prod = pd.DataFrame({\"STEP\": np.arange(1, len(seq) + 1), \"SKU_CD\": seq,\n                         \"SKU_NM\": sku.loc[seq, \"SKU_NM\"].to_numpy(), \"QTY\": q,\n                         \"START\": end - dur, \"END\": end})\n    prod_end = prod.set_index(\"SKU_CD\")[\"END\"]\n    step_of = prod.set_index(\"SKU_CD\")[\"STEP\"]\n\n    ln = day_lines.assign(READY=day_lines[\"SKU_CD\"].map(prod_end),\n                          STEP=day_lines[\"SKU_CD\"].map(step_of))\n    od = (ln.groupby(\"ORDER_NO\")\n            .agg(TYPE=(\"DELIVERY_TYPE\", \"first\"), READY=(\"READY\", \"max\"),\n                 READY_STEP=(\"STEP\", \"max\"), N_ITEMS=(\"QTY\", \"sum\"), N_SKU=(\"SKU_CD\", \"nunique\"))\n            .reset_index())\n\n    od = _pick(od).sort_values(\"DONE\", kind=\"stable\").reset_index(drop=True)\n\n    ev_in = prod[[\"END\", \"SKU_CD\", \"QTY\"]].rename(columns={\"END\": \"T\"}).assign(K=0)\n    ev_out = ln.merge(od[[\"ORDER_NO\", \"DONE\"]], on=\"ORDER_NO\")[[\"DONE\", \"SKU_CD\", \"QTY\"]]\n    ev_out = ev_out.rename(columns={\"DONE\": \"T\"}).assign(QTY=lambda d: -d[\"QTY\"], K=1)\n    ev = pd.concat([ev_in, ev_out]).sort_values([\"T\", \"K\"], kind=\"stable\")\n\n    per_cell, cpu = sku[\"PER_CELL\"].to_dict(), sku[\"CELLS_PER_UNIT\"].to_dict()\n    stock = dict.fromkeys(seq, 0)\n    cells, rec_t, rec_c = 0, [0.0], [0]\n    for t, s, dq in zip(ev[\"T\"].to_numpy(), ev[\"SKU_CD\"].to_numpy(), ev[\"QTY\"].to_numpy()):\n        before = _cells(stock[s], per_cell[s], cpu[s])\n        stock[s] += dq\n        cells += _cells(stock[s], per_cell[s], cpu[s]) - before\n        rec_t.append(t)\n        rec_c.append(cells)\n    tl = pd.DataFrame({\"T\": rec_t, \"CELLS\": rec_c}).groupby(\"T\", as_index=False).last()\n    done_all = np.sort(od[\"DONE\"].to_numpy())\n    tl[\"ORDERS_DONE\"] = np.searchsorted(done_all, tl[\"T\"], side=\"right\")\n\n    for t in TYPE_ORDER:\n        sub = od[od[\"TYPE\"] == t]\n        prod[f\"NEW_READY_{t}\"] = prod[\"STEP\"].map(sub.groupby(\"READY_STEP\").size()).fillna(0).astype(int)\n        prod[f\"CUM_READY_{t}\"] = prod[f\"NEW_READY_{t}\"].cumsum()\n        prod[f\"CUM_DONE_{t}\"] = np.searchsorted(np.sort(sub[\"DONE\"].to_numpy()), prod[\"END\"].to_numpy(), side=\"right\")\n    prod[\"NEW_READY\"] = sum(prod[f\"NEW_READY_{t}\"] for t in TYPE_ORDER)\n    prod[\"CUM_READY\"] = prod[\"NEW_READY\"].cumsum()\n    prod[\"CUM_DONE\"] = np.searchsorted(done_all, prod[\"END\"].to_numpy(), side=\"right\")\n    idx = np.searchsorted(tl[\"T\"].to_numpy(), prod[\"END\"].to_numpy(), side=\"right\") - 1\n    prod[\"CELLS\"] = tl[\"CELLS\"].to_numpy()[idx]\n\n    dt = np.diff(tl[\"T\"].to_numpy(), append=tl[\"T\"].iloc[-1])\n    makespan = float(od[\"DONE\"].max())\n    sm = {\"\uc0dd\uc0b0 \uc644\ub8cc(h)\": float(prod[\"END\"].iloc[-1]) / H}\n    for t in TYPE_ORDER:\n        sub = od[od[\"TYPE\"] == t]\n        sm[f\"{t} \uc8fc\ubb38 \uc218\"] = len(sub)\n        sm[f\"{t} \ucc98\ub9ac \uc644\ub8cc(h)\"] = float(sub[\"DONE\"].max()) / H if len(sub) else np.nan\n        sm[f\"{t} \ud3c9\uade0 \ub300\uae30(h)\"] = float(sub[\"WAIT\"].mean()) / H if len(sub) else np.nan\n    sm.update({\n        \"\uc804\uccb4 \ucc98\ub9ac \uc644\ub8cc(h)\": makespan / H,\n        \"\ucd5c\ub300 \uc0ac\uc6a9 \uce78 \uc218\": int(tl[\"CELLS\"].max()),\n        \"\ucd5c\ub300 \uce78 \ub3c4\ub2ec \uc2dc\uac01(h)\": float(tl.loc[tl[\"CELLS\"].idxmax(), \"T\"]) / H,\n        \"\ud3c9\uade0 \uc0ac\uc6a9 \uce78 \uc218(\uc2dc\uac04\uac00\uc911)\": float((tl[\"CELLS\"] * dt).sum() / makespan),\n        \"\uc8fc\ubb38 \uc218\": len(od),\n        \"\ubc18\ucc2c \uc218\": int(od[\"N_ITEMS\"].sum()),\n        \"SKU \uc218\": len(seq),\n    })\n    return {\"production\": prod, \"orders\": od, \"timeline\": tl, \"summary\": sm}\n";
const PY_G2 = "\"\"\"\ngreedy2.py \u2014 \uc6b0\uc120\uc21c\uc704\ub97c \uc790\uc720 \uc870\ud569\ud560 \uc218 \uc788\uac8c \ud655\uc7a5\ud55c \uadf8\ub9ac\ub514 + \uc815\ub82c\ud615\n\n1\uc21c\uc704(\uadf8\ub9ac\ub514\uc758 \ud575\uc2ec \uc810\uc218 \uacc4\uc0b0 \ubc29\uc2dd)\uc640 2\u00b73\uc21c\uc704(\ub3d9\uc810\uc77c \ub54c \ubcfc \uae30\uc900)\ub97c \uc790\uc720 \uc870\ud569\ud560 \uc218 \uc788\uc5b4\uc694.\n\"\"\"\nimport random\n\nPRIMARY_LABELS = {\n    \"count\": \"\uc9c0\uae08 \ub9cc\ub4e4\uba74 \ubc14\ub85c \ub05d\ub098\ub294 \uc8fc\ubb38 \uc218\",\n    \"count_partial\": \"\uc9c0\uae08 \ub9cc\ub4e4\uba74 \ubc14\ub85c \ub05d\ub098\ub294 \uc8fc\ubb38 \uc218 (\uac70\uc758 \ub2e4 \ub05d\ub09c \uc8fc\ubb38\ub3c4 \ubbf8\ub9ac \ubc18\uc601)\",\n    \"count_ddweighted\": \"\uc9c0\uae08 \ub9cc\ub4e4\uba74 \ubc14\ub85c \ub05d\ub098\ub294 \uc8fc\ubb38 \uc218 (\uc0c8\ubcbd\ubc30\uc1a1 \uc8fc\ubb38\uc744 2\ubc30 \uc911\uc694\ud558\uac8c)\",\n}\nTIE_LABELS = {\n    \"none\": \"\uc0ac\uc6a9 \uc548 \ud568\",\n    \"time_asc\": \"\uc0dd\uc0b0\uc2dc\uac04\uc774 \uc9e7\uc740 \uac83\",\n    \"demand_desc\": \"\uc774 \uc0c1\ud488\uc744 \ud544\uc694\ub85c \ud558\ub294 \ub300\uae30 \uc8fc\ubb38\uc774 \ub9ce\uc740 \uac83\",\n    \"cells_asc\": \"\uc120\ubc18 \uce78\uc744 \uc801\uac8c \ucc28\uc9c0\ud558\ub294 \uac83\",\n    \"qty_desc\": \"\uc624\ub298 \ub9cc\ub4e4 \uac1c\uc218\uac00 \ub9ce\uc740 \uac83\",\n}\nSORT_LABELS = {\n    \"qty_desc\": \"\uc624\ub298 \ub9cc\ub4e4 \uac1c\uc218\uac00 \ub9ce\uc740 \uc21c\",\n    \"qty_asc\": \"\uc624\ub298 \ub9cc\ub4e4 \uac1c\uc218\uac00 \uc801\uc740 \uc21c\",\n    \"time_asc\": \"\uc0dd\uc0b0\uc2dc\uac04\uc774 \uc9e7\uc740 \uc21c\",\n    \"demand_desc\": \"\ud544\uc694\ub85c \ud558\ub294 \uc8fc\ubb38\uc774 \ub9ce\uc740 \uc21c\",\n    \"cells_asc\": \"\uc120\ubc18 \uce78\uc744 \uc801\uac8c \ucc28\uc9c0\ud558\ub294 \uc21c\",\n    \"code\": \"\uc0c1\ud488\ucf54\ub4dc \uc21c (\ud2b9\ubcc4\ud55c \uae30\uc900 \uc5c6\uc74c)\",\n    \"random\": \"\ubb34\uc791\uc704\",\n}\n\n\ndef prep_day(P, day, sku):\n    \"\"\"\ud558\ub8e8\uce58 \ub370\uc774\ud130\ub97c \ud55c \ubc88\ub9cc \uc815\ub9ac\ud574\uc11c, \uc5ec\ub7ec config\uc5d0 \uc7ac\uc0ac\uc6a9\ud55c\ub2e4.\"\"\"\n    needs = day.groupby(\"ORDER_NO\")[\"SKU_CD\"].apply(set).to_dict()\n    typ = day.groupby(\"ORDER_NO\")[\"DELIVERY_TYPE\"].first().to_dict()\n    qty = day.groupby(\"SKU_CD\")[\"QTY\"].sum().to_dict()\n    orders_of = {}\n    for o, skus in needs.items():\n        for x in skus:\n            orders_of.setdefault(x, []).append(o)\n    demand_total = {x: len(v) for x, v in orders_of.items()}\n    dur = {x: sku.at[x, \"SETUP_SEC\"] + sku.at[x, \"UNIT_SEC\"] * qty[x] for x in qty}\n    cells = {x: P._cells(qty[x], sku.at[x, \"PER_CELL\"], sku.at[x, \"CELLS_PER_UNIT\"]) for x in qty}\n    return dict(needs=needs, typ=typ, qty=qty, orders_of=orders_of,\n                demand_total=demand_total, dur=dur, cells=cells)\n\n\ndef greedy2(ctx, primary=\"count\", ties=(), prefix=None):\n    \"\"\"prefix\ub97c \uc8fc\uba74, \uc774\ubbf8 \uadf8 \uc21c\uc11c\uae4c\uc9c0\ub294 \uc815\ud574\uc84c\ub2e4\uace0 \ubcf4\uace0 \uac70\uae30\uc11c\ubd80\ud130 \uc774\uc5b4\uc11c \uadf8\ub9ac\ub514\ub85c \ucc44\uc6c0\n    (MILP \ub4f1\uc73c\ub85c \uc55e\ubd80\ubd84\ub9cc \uba3c\uc800 \uc815\ud558\uace0 \ub098\uba38\uc9c0\ub97c \ucc44\uc6b8 \ub54c \uc500).\"\"\"\n    needs, typ, qty, orders_of = ctx[\"needs\"], ctx[\"typ\"], ctx[\"qty\"], ctx[\"orders_of\"]\n    dur, cells = ctx[\"dur\"], ctx[\"cells\"]\n\n    def one_tie(name, x, demand):\n        if name == \"time_asc\": return -dur[x]\n        if name == \"demand_desc\": return demand\n        if name == \"cells_asc\": return -cells[x]\n        if name == \"qty_desc\": return qty[x]\n        return 0\n\n    seq = list(prefix) if prefix else []\n    made = set(seq)\n    remaining = set(orders_of) - made\n    pending = {o for o in needs if not needs[o] <= made}\n    while remaining:\n        best, best_key = None, None\n        for x in sorted(remaining):\n            score, demand = 0.0, 0\n            for o in orders_of[x]:\n                if o not in pending:\n                    continue\n                demand += 1\n                left = needs[o] - made\n                if len(left) == 1:\n                    score += 2.0 if (primary == \"count_ddweighted\" and typ[o] == \"DD\") else 1.0\n                elif primary == \"count_partial\":\n                    score += 1.0 / len(left)\n            key = (score,) + tuple(one_tie(t, x, demand) for t in ties)\n            if best_key is None or key > best_key:\n                best, best_key = x, key\n        seq.append(best)\n        made.add(best)\n        remaining.remove(best)\n        pending = {o for o in pending if not needs[o] <= made}\n    return seq\n\n\ndef static_sort(ctx, key):\n    qty, dur, cells, demand_total = ctx[\"qty\"], ctx[\"dur\"], ctx[\"cells\"], ctx[\"demand_total\"]\n    skus = sorted(qty)\n    if key == \"code\": return skus\n    if key == \"qty_desc\": return sorted(skus, key=lambda x: (-qty[x], x))\n    if key == \"qty_asc\": return sorted(skus, key=lambda x: (qty[x], x))\n    if key == \"time_asc\": return sorted(skus, key=lambda x: (dur[x], x))\n    if key == \"demand_desc\": return sorted(skus, key=lambda x: (-demand_total[x], x))\n    if key == \"cells_asc\": return sorted(skus, key=lambda x: (cells[x], x))\n    if key == \"random\":\n        s = skus[:]; random.Random(0).shuffle(s); return s\n    raise ValueError(key)\n\n\ndef all_configs():\n    configs = []\n    for key in SORT_LABELS:\n        configs.append({\"family\": \"sort\", \"key\": key})\n    tie_keys = [k for k in TIE_LABELS if k != \"none\"]\n    for primary in PRIMARY_LABELS:\n        configs.append({\"family\": \"greedy\", \"primary\": primary, \"tie2\": \"none\", \"tie3\": \"none\"})\n        for t2 in tie_keys:\n            configs.append({\"family\": \"greedy\", \"primary\": primary, \"tie2\": t2, \"tie3\": \"none\"})\n            for t3 in tie_keys:\n                if t3 == t2: continue\n                configs.append({\"family\": \"greedy\", \"primary\": primary, \"tie2\": t2, \"tie3\": t3})\n    return configs\n\n\ndef config_id(cfg):\n    if cfg[\"family\"] == \"sort\":\n        return f\"sort:{cfg['key']}\"\n    return f\"greedy:{cfg['primary']}:{cfg['tie2']}:{cfg['tie3']}\"\n\n\ndef parse_config(cid):\n    \"\"\"config_id()\uc758 \uc5ed\ud568\uc218. 'sort:qty_desc' / 'greedy:count:demand_desc:none' \ud615\uc2dd\uc744 \uc77d\uc74c.\"\"\"\n    parts = cid.split(\":\")\n    if parts[0] == \"sort\":\n        return {\"family\": \"sort\", \"key\": parts[1]}\n    if parts[0] == \"greedy\":\n        return {\"family\": \"greedy\", \"primary\": parts[1], \"tie2\": parts[2], \"tie3\": parts[3]}\n    raise ValueError(f\"\uc54c \uc218 \uc5c6\ub294 \uc124\uc815 id: {cid}\")\n\n\ndef build_sequence(ctx, cfg):\n    if cfg[\"family\"] == \"sort\":\n        return static_sort(ctx, cfg[\"key\"])\n    ties = tuple(t for t in (cfg[\"tie2\"], cfg[\"tie3\"]) if t != \"none\")\n    return greedy2(ctx, primary=cfg[\"primary\"], ties=ties)\n\n\n# ---------------------------------------------------------------- \uc790\ub3d9 \ud0d0\uc0c9 (\uc720\uc804 \uc54c\uace0\ub9ac\uc998)\ndef _order_crossover(a, b, rng):\n    n = len(a)\n    i, j = sorted(rng.sample(range(n), 2))\n    mid = a[i:j]\n    rest = [x for x in b if x not in set(mid)]\n    return rest[:i] + mid + rest[i:]\n\n\ndef genetic_sequence(P, day, sku, ctx, key_fn, budget=200, pop_size=10, seed=0):\n    \"\"\"\uc5ec\ub7ec \uc21c\uc11c\ub97c \uc11e\uace0 \uac00\ub054 \ubc14\uafd4\uac00\uba70(\uad50\ucc28+\ub3cc\uc5f0\ubcc0\uc774), key_fn(\uc791\uc744\uc218\ub85d \uc88b\uc74c) \uc810\uc218\ub97c \uc904\uc5ec\uac00\ub294 \ud0d0\uc0c9.\n    key_fn(summary) -> \ube44\uad50\uc6a9 \ud29c\ud50c. \uc2dc\uc791 \uc9d1\ub2e8\uc740 \uadf8\ub9ac\ub514 \uba87 \uac00\uc9c0\ub85c \ucc44\uc6b4\ub2e4.\"\"\"\n    rng = random.Random(seed)\n    cache = {}\n\n    def score(seq):\n        k = tuple(seq)\n        if k not in cache:\n            res = P.simulate_day(day, list(seq), sku)\n            cache[k] = key_fn(res[\"summary\"])\n        return cache[k]\n\n    seeds = [\n        greedy2(ctx, primary=\"count_partial\"),\n        greedy2(ctx, primary=\"count\", ties=(\"demand_desc\",)),\n        static_sort(ctx, \"qty_desc\"),\n        static_sort(ctx, \"demand_desc\"),\n    ]\n    base = sorted(ctx[\"qty\"])\n    pop = [list(s) for s in seeds][:pop_size]\n    while len(pop) < pop_size:\n        s = base[:]\n        rng.shuffle(s)\n        pop.append(s)\n    scored = sorted(((score(s), s) for s in pop), key=lambda t: t[0])\n    calls = pop_size\n\n    while calls < budget:\n        children = []\n        for _ in range(pop_size):\n            p1 = min(rng.sample(scored, 3), key=lambda t: t[0])[1]\n            p2 = min(rng.sample(scored, 3), key=lambda t: t[0])[1]\n            c = _order_crossover(p1, p2, rng)\n            if rng.random() < 0.5:\n                i, j = rng.sample(range(len(c)), 2)\n                c.insert(j, c.pop(i))\n            children.append(c)\n            calls += 1\n            if calls >= budget:\n                break\n        scored = sorted(scored + [(score(c), c) for c in children], key=lambda t: t[0])[:pop_size]\n    return scored[0][1]\n";

const PRIMARY_LABELS = {
  count: "지금 만들면 바로 끝나는 주문 수",
  count_partial: "지금 만들면 바로 끝나는 주문 수 (거의 다 끝난 주문도 미리 반영)",
  count_ddweighted: "지금 만들면 바로 끝나는 주문 수 (새벽배송 주문을 2배 중요하게)",
};
const TIE_LABELS = {
  none: "사용 안 함",
  time_asc: "생산시간이 짧은 것",
  demand_desc: "이 상품을 필요로 하는 대기 주문이 많은 것",
  cells_asc: "차지하는 칸이 적은 것",
  qty_desc: "오늘 만들 개수가 많은 것",
};

const $ = (s) => document.querySelector(s);
let pyodide = null;
let filesReady = { simple: false, size: false, time: false };
let allDates = [];

function fillSelect(sel, labels) {
  sel.innerHTML = Object.entries(labels).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
}
fillSelect($("#pPrimary"), PRIMARY_LABELS);
fillSelect($("#pTie2"), TIE_LABELS);
fillSelect($("#pTie3"), TIE_LABELS);
$("#pGenetic").addEventListener("change", (e) => { $("#pBudgetWrap").style.display = e.target.checked ? "" : "none"; });

async function initPyodide() {
  const statusEl = $("#pyStatus");
  try {
    statusEl.textContent = "Pyodide 불러오는 중... (처음 한 번만, 수십 초 걸릴 수 있어요)";
    pyodide = await loadPyodide();
    statusEl.textContent += "\n완료. pandas/numpy 설치 중...";
    await pyodide.loadPackage(["pandas", "numpy"]);
    try {
      await pyodide.loadPackage(["openpyxl"]);
    } catch (e) {
      statusEl.textContent += "\nopenpyxl을 micropip으로 재시도...";
      await pyodide.loadPackage("micropip");
      await pyodide.runPythonAsync(`
import micropip
await micropip.install("openpyxl")
      `);
    }
    pyodide.FS.writeFile("production_core.py", PY_CORE);
    pyodide.FS.writeFile("greedy2.py", PY_G2);
    statusEl.textContent = "준비 완료 — 이제 아래에서 파일을 올려주세요.";
    $("#stepFiles").classList.remove("disabled");
  } catch (e) {
    statusEl.textContent = "준비 실패: " + e.toString() + "\n(네트워크가 막혀있거나, 브라우저가 WebAssembly를 지원 안 할 수 있어요)";
  }
}

async function fileToBytes(file) {
  const buf = await file.arrayBuffer();
  return new Uint8Array(buf);
}

async function tryLoadData() {
  if (!(filesReady.simple && filesReady.size && filesReady.time)) return;
  const statusEl = $("#loadStatus");
  statusEl.className = "load-msg";
  statusEl.textContent = "데이터 읽는 중...";
  try {
    await pyodide.runPythonAsync(`
import production_core as PC
sku, lines = PC.load_data()
dates_out = sorted(str(d.date()) for d in lines["ORDER_DATE"].unique())
    `);
    allDates = pyodide.globals.get("dates_out").toJs();
    $("#pDate").innerHTML = allDates.map((d) => `<option value="${d}">${d}</option>`).join("");
    statusEl.className = "load-msg ok";
    statusEl.textContent = `읽기 완료 — 주문 ${pyodide.runPython("len(lines)")}행, 날짜 ${allDates.length}개`;
    $("#stepParam").classList.remove("disabled");
    $("#runBtn").disabled = false;
  } catch (e) {
    statusEl.className = "load-msg err";
    statusEl.textContent = "읽기 실패: " + e.toString();
  }
}

function wireFile(inputId, stateId, key, fsName) {
  $(inputId).addEventListener("change", async (e) => {
    const f = e.target.files[0];
    const st = $(stateId);
    if (!f) return;
    st.textContent = "읽는 중...";
    try {
      const bytes = await fileToBytes(f);
      pyodide.FS.writeFile(fsName, bytes);
      st.textContent = "완료 (" + f.name + ")";
      st.className = "state ok";
      filesReady[key] = true;
      tryLoadData();
    } catch (err) {
      st.textContent = "오류: " + err;
      st.className = "state";
    }
  });
}
wireFile("#fSimple", "#fSimpleState", "simple", "simple_data.xlsx");
wireFile("#fSize", "#fSizeState", "size", "sku_size.xlsx");
wireFile("#fTime", "#fTimeState", "time", "sku_production_time.csv");

$("#runBtn").addEventListener("click", async () => {
  const btn = $("#runBtn"), st = $("#runStatus");
  btn.disabled = true;
  st.className = "load-msg";
  const date = $("#pDate").value, primary = $("#pPrimary").value;
  const tie2 = $("#pTie2").value, tie3 = $("#pTie3").value;
  const useGenetic = $("#pGenetic").checked, budget = parseInt($("#pBudget").value || "150", 10);
  st.textContent = useGenetic ? "그리디 계산 후 유전 알고리즘으로 개선 중... (몇 초~몇십 초)" : "계산 중...";
  try {
    pyodide.globals.set("w_date", date);
    pyodide.globals.set("w_primary", primary);
    pyodide.globals.set("w_ties", [tie2, tie3].filter((t) => t !== "none"));
    pyodide.globals.set("w_genetic", useGenetic);
    pyodide.globals.set("w_budget", budget);

    const resultJson = await pyodide.runPythonAsync(`
import json
import pandas as pd
import greedy2 as G2

d = pd.Timestamp(w_date).normalize()
day = lines[lines["ORDER_DATE"] == d]
ctx = G2.prep_day(PC, day, sku)
seq = G2.greedy2(ctx, primary=w_primary, ties=tuple(w_ties))
used = "그리디"
if w_genetic:
    def key_fn(sm):
        dd = sm["DD 처리 완료(h)"]
        return (sm["최대 사용 칸 수"], 0.0 if pd.isna(dd) else dd, sm["전체 처리 완료(h)"])
    seq = G2.genetic_sequence(PC, day, sku, ctx, key_fn, budget=w_budget)
    used = "그리디+유전"

res = PC.simulate_day(day, seq, sku)
pr, tl, sm = res["production"], res["timeline"], res["summary"]
H = PC.H
production = [{
    "step": int(r.STEP), "sku_cd": r.SKU_CD, "sku_nm": r.SKU_NM, "qty": float(r.QTY),
    "start_h": round(r.START / H, 4), "end_h": round(r.END / H, 4),
    "new_dd": int(r.NEW_READY_DD), "new_pd": int(r.NEW_READY_PD),
    "cum_ready_dd": int(r.CUM_READY_DD), "cum_ready_pd": int(r.CUM_READY_PD),
    "cum_done_dd": int(r.CUM_DONE_DD), "cum_done_pd": int(r.CUM_DONE_PD),
    "cells": int(r.CELLS),
} for r in pr.itertuples()]
timeline = [{"t_h": round(r.T / H, 4), "cells": int(r.CELLS)} for r in tl.itertuples()]
summary = {k: (None if isinstance(v, float) and pd.isna(v) else (round(v, 3) if isinstance(v, float) else v)) for k, v in sm.items()}
json.dumps({"used": used, "date": w_date, "production": production, "timeline": timeline, "summary": summary})
    `);

    const result = JSON.parse(resultJson);
    renderResult(result);
    st.className = "load-msg ok";
    st.textContent = "계산 완료";
  } catch (e) {
    st.className = "load-msg err";
    st.textContent = "계산 실패: " + e.toString();
  } finally {
    btn.disabled = false;
  }
});

function renderResult(result) {
  $("#resultArea").hidden = false;
  $("#resultTitle").textContent = `${result.date} · ${result.used}`;
  const sm = result.summary;
  $("#kpi2").innerHTML = [
    ["최대 사용 칸 수", sm["최대 사용 칸 수"]],
    ["DD 처리 완료(h)", sm["DD 처리 완료(h)"]],
    ["PD 처리 완료(h)", sm["PD 처리 완료(h)"]],
    ["전체 처리 완료(h)", sm["전체 처리 완료(h)"]],
  ].map(([k, v]) => `<div><span>${k}</span><b>${v ?? "—"}</b></div>`).join("");
  $("#progressChart").innerHTML = progressSVG(result.production);
  $("#shelfChart").innerHTML = shelfSVG(result.timeline, 200);
  $("#resultArea").scrollIntoView({ behavior: "smooth" });
}

initPyodide();
</script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
</body>
</html>
